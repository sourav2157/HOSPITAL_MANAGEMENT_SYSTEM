<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital System - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg-color);">
    <div class="client-box" style="width: 100%; max-width: 420px;">
        <div style="text-align: center; margin-bottom: 25px;">
            <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--accent-blue);">🏥 Hospital Staff Portal</h1>
            <div style="font-size: 0.9rem; color: var(--text-secondary); margin-top: 5px;">Role-Based Hospital Management System</div>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label>Username:</label>
                <input type="text" id="username" required placeholder="e.g. doc_smith, nurse_sarah, reception_user">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="password" required placeholder="Enter password">
            </div>

            <button type="submit" class="btn" style="margin-top: 10px;">🔑 Log In to Dashboard</button>
        </form>

        <div id="login-error" style="color: var(--accent-red); text-align: center; margin-top: 15px; font-weight: bold; font-size: 0.9rem;"></div>

        <div style="margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--border-color); font-size: 0.82rem; color: var(--text-secondary);">
            <strong>Demo Quick Login Accounts:</strong>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px;">
                <button type="button" class="btn-card" onclick="quickLogin('doc_smith', 'doc123')">🩺 Doctor</button>
                <button type="button" class="btn-card" onclick="quickLogin('nurse_sarah', 'nurse123')">👩‍⚕️ Nurse</button>
                <button type="button" class="btn-card" onclick="quickLogin('reception_user', 'rec123')">📋 Receptionist</button>
                <button type="button" class="btn-card" onclick="quickLogin('admin', 'admin123')">⚙️ Admin</button>
            </div>
        </div>
    </div>

    <script>
        function quickLogin(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
            doLogin(u, p);
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            doLogin(u, p);
        });

        function doLogin(username, password) {
            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    window.location.href = '/';
                } else {
                    document.getElementById('login-error').textContent = data.message || 'Invalid username or password.';
                }
            });
        }
    </script>
</body>
</html>
